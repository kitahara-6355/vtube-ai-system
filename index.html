<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baking and Image Generation with Gemini API</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <main>
    <h1>Baking with the Gemini API</h1>
    <form id="text-generation-form">
      <div class="image-picker">
        <label class="image-choice">
          <input type="radio" checked name="chosen-image" value="/baked_goods_1.jpg">
          <img src="/baked_goods_1.jpg">
        </label>
        <label class="image-choice">
          <input type="radio" name="chosen-image" value="/baked_goods_2.jpg">
          <img src="/baked_goods_2.jpg">
        </label>
        <label class="image-choice">
          <input type="radio" name="chosen-image" value="/baked_goods_3.jpg">
          <img src="/baked_goods_3.jpg">
        </label>
      </div>
      <div class="prompt-box">
        <label>
          <input name="prompt" placeholder="Enter instructions here" type="text"
            value="Provide an example recipe for the baked goods in the image">
        </label>
        <button type="submit">Go</button>
      </div>
    </form>
    <p class="output">(Results will appear here)</p>
  </main>

  <hr>

  <section class="image-generation-section">
    <h2>イラスト自動生成 (Imagen)</h2>
    <form id="image-generation-form">
        <div class="prompt-box">
            <label>
                <textarea name="image-prompt" placeholder="例: 赤いスケートボードを持つロボット" rows="3"></textarea>
            </label>
            <button type="submit" id="generate-image-button">イラストを生成</button>
        </div>
    </form>
    <div id="generated-image-container" class="output">
        <p>(ここに生成された画像が表示されます)</p>
    </div>
  </section>

  <script type="module" src="/main.js"></script>
</body>

</html>
